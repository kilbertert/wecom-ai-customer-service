name: OpenCodeReview (advisory)

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to review
        required: true
        type: string
      force:
        description: Re-run a previously reviewed head SHA (explicit human request)
        required: false
        default: false
        type: boolean
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: open-code-review-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number || github.run_id }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        github.event.comment.user.type != 'Bot' &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
        (
          startsWith(github.event.comment.body, '/open-code-review') ||
          startsWith(github.event.comment.body, '@open-code-review')
          )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Resolve pull request
        id: pr
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ inputs.pr_number || github.event.issue.number }}
        with:
          script: |
            const prNumber = Number(process.env.PR_NUMBER);
            if (!Number.isInteger(prNumber) || prNumber <= 0) {
              core.setFailed(`Invalid pull request number: ${process.env.PR_NUMBER}`);
              return;
            }

            const { data: pullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            core.setOutput('base_ref', pullRequest.base.ref);
            core.setOutput('head_sha', pullRequest.head.sha);
            core.setOutput('title', pullRequest.title);
            core.setOutput('pr_number', String(prNumber));

      - name: Enforce one review per head SHA
        id: guard
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          FORCE_REVIEW: ${{ inputs.force || 'false' }}
        with:
          script: |
            const prNumber = Number(process.env.PR_NUMBER);
            const headSha = process.env.HEAD_SHA;
            const force = process.env.FORCE_REVIEW === 'true';
            if (!Number.isInteger(prNumber) || !headSha) {
              core.setFailed('Missing pull request number or head SHA');
              return;
            }

            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                per_page: 100,
              },
            );
            const marker = `<!-- open-code-review-head:${headSha} -->`;
            const alreadyReviewed = comments.some((comment) => comment.body?.includes(marker));
            if (alreadyReviewed && !force) {
              core.info(`Skipping duplicate advisory review for ${headSha}`);
              core.setOutput('should_review', 'false');
              return;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: `${marker}\nOpenCodeReview started for commit \`${headSha.slice(0, 12)}\`. This result is advisory and does not block merging.`,
            });
            core.setOutput('should_review', 'true');

      - name: Run OpenCodeReview
        id: ocr
        if: steps.guard.outputs.should_review == 'true'
        continue-on-error: true
        uses: alibaba/open-code-review@e670b3b3f6b56ef63f4222148696e315268a26e2 # v1.8.0
        with:
          llm_url: https://rainyun-g74a8dea.tail5df4d7.ts.net:10000/v1/chat/completions
          llm_auth_token: ${{ secrets.OCR_LLM_AUTH_TOKEN }}
          llm_model: gpt-5.6-sol
          llm_use_anthropic: 'false'
          llm_extra_body: '{"max_completion_tokens":4096}'
          language: 中文
          base_ref: ${{ steps.pr.outputs.base_ref }}
          head_sha: ${{ steps.pr.outputs.head_sha }}
          background: ${{ steps.pr.outputs.title }}
          ocr_version: 1.8.0
          review_concurrency: '1'
          sticky_summary: 'true'
          incremental: 'true'
          upload_artifacts: 'false'

      - name: Upload OCR session diagnostics
        if: always() && steps.guard.outputs.should_review == 'true' && steps.ocr.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: ocr-session-${{ github.run_id }}-${{ github.run_attempt }}
          path: ~/.opencodereview/sessions
          if-no-files-found: warn
          retention-days: 3

      - name: Summarize advisory review
        if: always()
        shell: bash
        env:
          OCR_OUTCOME: ${{ steps.ocr.outcome }}
        run: |
          {
            echo '## OpenCodeReview advisory result'
            echo
            echo "Action outcome: $OCR_OUTCOME"
            if [[ -s /tmp/ocr-result.json ]] && jq -e . /tmp/ocr-result.json >/dev/null 2>&1; then
              echo
              if ! jq -r '
                  try (
                    "Status: \(.status // "unknown")\n" +
                    "Comments: \(.summary.comments // 0)\n" +
                    "Critical/high: \([.comments[]? | select(.severity == "critical" or .severity == "high")] | length)"
                  ) catch "Structured result could not be summarized."
                ' /tmp/ocr-result.json; then
                echo 'Structured result could not be summarized; inspect the advisory comments directly.'
              fi
            elif [[ "${{ steps.guard.outputs.should_review }}" != 'true' ]]; then
              echo 'This head SHA already has an advisory review; no duplicate run was started.'
            else
              echo 'No valid structured result was produced; the review remains advisory.'
            fi
            echo
            echo 'This review is advisory and requires human triage.'
          } >>"$GITHUB_STEP_SUMMARY"
