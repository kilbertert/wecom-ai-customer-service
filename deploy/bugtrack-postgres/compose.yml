services:
  bugtrack-postgres:
    image: postgres:15-alpine
    container_name: bugtrack-postgres
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - bugtrack_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  bugtrack_postgres_data:
    name: bugtrack_postgres_data

